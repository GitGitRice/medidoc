# Laesst die Tests bei jedem Push und jedem Pull Request laufen.
#
# Zwei getrennte Jobs, damit man auf einen Blick sieht, welche Seite rot ist —
# und damit Backend und Frontend parallel laufen.
#
# Die Tests brauchen keine Datenbank: Das Backend testet gegen SQLite im
# Speicher (backend/tests/conftest.py), das Frontend gegen jsdom.
name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # `app.core.config` liest die .env aus der Repo-Wurzel und hat fuer
      # JWT_SECRET bewusst keinen Default. Die Vorlage enthaelt reine
      # Testwerte — hier ist das genau richtig, in echt niemals.
      - name: Konfiguration aus der Vorlage
        run: cp .env.example .env
        working-directory: ${{ github.workspace }}

      - run: pip install -r requirements.txt

      - run: pytest -q

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm test
