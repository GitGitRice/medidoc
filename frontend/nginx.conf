server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router uebernimmt das Routing im Browser — jede unbekannte Route
    # muss serverseitig auf index.html zurueckfallen, sonst gibt es beim
    # Neuladen einer Unterseite (z. B. /patients/3) einen 404 von nginx.
    location / {
        try_files $uri /index.html;
    }
}
