[pytest]
# `pythonpath = .` macht `app` importierbar, ohne dass das Backend als Paket
# installiert werden muss — aufgerufen wird pytest aus `backend/`.
pythonpath = .
testpaths = tests

# Eine Abkuendigung laesst den Lauf scheitern, statt eine Zeile im Bericht zu
# hinterlassen, die niemand liest. Genau so ist zweimal veralteter Code
# hereingekommen: Beide Male stand die Warnung im Lauf, beide Male grün.
#
# Wenn das hier rot wird, ist das die Einladung, die neue Schreibweise zu
# benutzen — nicht, diese Zeile zu entfernen. Eine einzelne Warnung aus einer
# fremden Abhaengigkeit, die wir nicht abstellen koennen, wird darunter
# einzeln auf "ignore" gesetzt und mit dem Grund kommentiert.
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
    # Muss einzeln dastehen: Starlette leitet seine Abkuendigungen von
    # UserWarning ab, nicht von DeprecationWarning — die beiden Zeilen darueber
    # fangen sie also nicht. Geprueft, indem eine alte Schreibweise absichtlich
    # wieder eingesetzt wurde; ohne diese Zeile lief der Test gruen durch.
    error::starlette.exceptions.StarletteDeprecationWarning
