services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB muss in .env gesetzt sein}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER muss in .env gesetzt sein}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mdoc-fastapi
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      # Im Compose-Netz heisst die Datenbank wie ihr Service, nicht localhost.
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mdoc-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Abhaengigkeiten aus dem Image duerfen nicht vom Bind-Mount verdeckt werden.
      - frontend_node_modules:/app/node_modules
    environment:
      # Die URL wird im Browser aufgerufen; dort ist der Compose-Servicename unbekannt.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - fastapi
    restart: unless-stopped
volumes:
  postgres_data:
  frontend_node_modules:
