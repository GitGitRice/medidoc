services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB muss in .env gesetzt sein}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER muss in .env gesetzt sein}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in .env gesetzt sein}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mdoc-fastapi
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      # Im Compose-Netz heisst die Datenbank wie ihr Service, nicht localhost.
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
volumes:
  postgres_data:
